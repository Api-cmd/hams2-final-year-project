<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments — HAMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Filter tab buttons — sit above the table */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 7px 16px;
      border: 1.5px solid var(--grey-200);
      border-radius: 20px;
      background: var(--white);
      color: var(--grey-700);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--blue); color: var(--blue); }
    .tab-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    /* Detail panel shown below the table when a row is clicked */
    .detail-panel {
      display: none;
      background: var(--blue-light);
      border: 1px solid var(--grey-200);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
    }
    .detail-panel.open { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .detail-item .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--grey-400);
      margin-bottom: 2px;
    }
    .detail-item .value {
      font-size: 0.95rem;
      color: var(--grey-900);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <i class="fa-solid fa-hospital"></i> HAMS
    </a>
    <div class="navbar-links">
      <a href="dashboard.html">
        <i class="fa-solid fa-gauge"></i> Dashboard
      </a>
      <a href="book.html">
        <i class="fa-solid fa-calendar-plus"></i> Book
      </a>
      <a href="appointments.html" class="active">
        <i class="fa-solid fa-calendar-check"></i> My Appointments
      </a>
      <a href="family.html">
        <i class="fa-solid fa-people-group"></i> Family
      </a>
      <div class="divider"></div>
      <a href="../php/logout.php">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    </div>
  </nav>

  <div style="padding:28px 32px; max-width:1100px; margin:0 auto;">

    <div class="page-header">
      <div>
        <h2>My Appointments</h2>
        <p class="text-muted text-sm">View, track, or cancel your appointments.</p>
      </div>
      <a href="book.html" class="btn btn-primary">
        <i class="fa-solid fa-calendar-plus"></i> Book New
      </a>
    </div>

    <div id="alert-box" class="alert" style="display:none;"></div>

    <!-- Filter tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('all', this)">
        All
      </button>
      <button class="tab-btn" onclick="switchTab('upcoming', this)">
        <i class="fa-solid fa-clock"></i> Upcoming
      </button>
      <button class="tab-btn" onclick="switchTab('past', this)">
        <i class="fa-solid fa-circle-check"></i> Past
      </button>
      <button class="tab-btn" onclick="switchTab('cancelled', this)">
        <i class="fa-solid fa-ban"></i> Cancelled
      </button>
    </div>

    <!-- Appointments table -->
    <div class="card">
      <div class="card-body" style="padding:0;">

        <div id="appt-loading" style="padding:32px; text-align:center; color:var(--grey-400);">
          <span class="spinner"></span>
          <p style="margin-top:8px;">Loading appointments...</p>
        </div>

        <div id="appt-wrap" style="display:none;">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>For</th>
                  <th>Doctor</th>
                  <th>Department</th>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="appt-tbody"></tbody>
            </table>
          </div>
        </div>

        <div id="appt-empty" class="empty-state" style="display:none;">
          <i class="fa-solid fa-calendar-xmark"
             style="font-size:2.5rem; color:var(--grey-400); display:block; margin-bottom:12px;"></i>
          <p>No appointments found.</p>
          <a href="book.html" class="btn btn-primary">Book an Appointment</a>
        </div>

      </div>
    </div>

    <!-- Detail panel — shown when a row is clicked -->
    <div class="detail-panel" id="detail-panel">
      <div class="flex-between">
        <h3 style="margin:0;">
          <i class="fa-solid fa-circle-info"></i> Appointment Details
        </h3>
        <button class="btn btn-ghost btn-sm" onclick="closeDetail()">
          <i class="fa-solid fa-xmark"></i> Close
        </button>
      </div>
      <div class="detail-grid" id="detail-grid"></div>
      <div style="margin-top:16px;" id="detail-actions"></div>
    </div>

  </div>

  <script src="../js/main.js"></script>
  <script>
    // ==========================================================
    // MY APPOINTMENTS PAGE JAVASCRIPT
    // ==========================================================

    let currentTab = 'all';  // Track which tab is active

    // Session check
    fetch('../php/session_check.php')
      .then(r => r.json())
      .then(d => {
        if (!d.logged_in || d.role !== 'patient') {
          window.location.href = '../index.html?msg=login_required';
        }
      });

    // --- Switch tab and reload with matching filter ---
    function switchTab(tab, btn) {
      currentTab = tab;

      //ina Update tab button styles
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      closeDetail();
      loadAppointments(tab);
    }

    // --- Load appointments from PHP ---
    async function loadAppointments(filter = 'all') {
      // Show loading state
      document.getElementById('appt-loading').style.display = 'block';
      document.getElementById('appt-wrap').style.display    = 'none';
      document.getElementById('appt-empty').style.display   = 'none';

      try {
        const res  = await fetch(`../php/get_appointments.php?status=${filter}&limit=100`);
        const data = await res.json();

        document.getElementById('appt-loading').style.display = 'none';

        if (!data.length) {
          document.getElementById('appt-empty').style.display = 'block';
          return;
        }

        const tbody = document.getElementById('appt-tbody');
        tbody.innerHTML = '';

        data.forEach((a, i) => {
          const forName = a.family_name || 'Myself';

          // Only show cancel button if status allows cancellation
          const canCancel = ['pending', 'confirmed'].includes(a.status);
          const actionHtml = canCancel
            ? `<button class="btn text-danger btn-sm"
                 onclick="cancelAppt(${a.appt_id}, this)">
                 <i class="fa-solid fa-ban"></i> Cancel
               </button>`
            : '—';

          const tr = document.createElement('tr');
          // Clicking anywhere on the row opens the detail panel
          tr.style.cursor = 'pointer';
          tr.onclick = () => showDetail(a);
          // Display doctor name if available, otherwise show "Auto-assigned"
          const doctorDisplay = a.doctor_name ? `Dr. ${escapeHtml(a.doctor_name)}` : '<span class="text-muted text-sm">Auto-assigned</span>';
          tr.innerHTML = `
            <td class="text-muted">${i + 1}</td>
            <td>${escapeHtml(forName)}</td>
            <td>${doctorDisplay}</td>
            <td>${escapeHtml(a.dept_name)}</td>
            <td>${formatDate(a.slot_date)}</td>
            <td>${formatTime(a.start_time)}</td>
            <td>${statusBadge(a.status)}</td>
            <td onclick="event.stopPropagation()">
              ${actionHtml}
            </td>
          `;
          // stopPropagation on the action cell prevents the row
          // click from firing when the cancel button is clicked
          tbody.appendChild(tr);
        });

        document.getElementById('appt-wrap').style.display = 'block';

      } catch (err) {
        document.getElementById('appt-loading').style.display = 'none';
        document.getElementById('appt-empty').style.display   = 'block';
        console.error('Load error:', err);
      }
    }

    // --- Show appointment detail panel ---
    // Triggered by clicking a table row
    function showDetail(appt) {
      const grid    = document.getElementById('detail-grid');
      const actions = document.getElementById('detail-actions');

      // Build detail items
      // Display doctor name if available, otherwise show "Auto-assigned"
      const doctorDisplay = appt.doctor_name ? 'Dr. ' + appt.doctor_name : 'Auto-assigned';
      const items = [
        { label: 'Appointment ID', value: '#' + appt.appt_id },
        { label: 'Booked For',     value: appt.family_name || 'Myself' },
        { label: 'Doctor',         value: doctorDisplay },
        { label: 'Department',     value: appt.dept_name },
        { label: 'Date',           value: formatDate(appt.slot_date) },
        { label: 'Time',           value: formatTime(appt.start_time) + ' – ' + formatTime(appt.end_time) },
        { label: 'Status',         value: statusBadge(appt.status) },
        { label: 'Booked On',      value: new Date(appt.created_at).toLocaleDateString('en-GB') },
      ];

      // Add notes row only if there are notes
      if (appt.notes) {
        items.push({ label: 'Your Notes', value: escapeHtml(appt.notes) });
      }

      // Add cancellation reason if cancelled
      if (appt.cancellation_reason) {
        items.push({ label: 'Cancellation Reason', value: escapeHtml(appt.cancellation_reason) });
      }

      grid.innerHTML = items.map(item => `
        <div class="detail-item">
          <div class="label">${item.label}</div>
          <div class="value">${item.value}</div>
        </div>
      `).join('');

      // Show cancel button in detail panel if applicable
      const canCancel = ['pending', 'confirmed'].includes(appt.status);
      actions.innerHTML = canCancel
        ? `<button class="btn text-danger" onclick="cancelAppt(${appt.appt_id}, this)">
             <i class="fa-solid fa-ban text-danger "></i> Cancel This Appointment
           </button>`
        : '';

      // Open the panel
      document.getElementById('detail-panel').classList.add('open');
      // Scroll down so the panel is visible
      document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('open');
    }

    // --- Cancel an appointment ---
    async function cancelAppt(apptId, btn) {
      if (!confirmAction('Are you sure you want to cancel this appointment?')) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res  = await fetch('../php/cancel_appointment.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appt_id: apptId }),
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Appointment cancelled successfully.', 'success');
          closeDetail();
          loadAppointments(currentTab); // Refresh the table
        } else {
          showAlert(data.error || 'Cancellation failed.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-ban"></i> Cancel';
        }
      } catch (err) {
        showAlert('Network error. Try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-ban"></i> Cancel';
      }
    }

    // Load all appointments on page open
    loadAppointments('all');
  </script>

</body>
</html>
