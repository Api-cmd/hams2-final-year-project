<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — HAMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <i class="fa-solid fa-hospital"></i> HAMS
    </a>
    <div class="navbar-links">
      <a href="dashboard.html">
        <i class="fa-solid fa-gauge"></i> Dashboard
      </a>
      <div class="divider"></div>
      <a href="../php/logout.php">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    </div>
  </nav>

  <div style="padding:28px 32px; max-width:600px; margin:0 auto;">

    <div class="page-header">
      <h2>My Profile</h2>
    </div>

    <div id="alert-box" class="alert" style="display:none;"></div>

    <!-- =====================================================
         SECTION 1: Personal Information (read + edit)
         ===================================================== -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header">
        <h3><i class="fa-solid fa-user"></i> Personal Information</h3>
        <button class="btn btn-ghost btn-sm" id="edit-info-btn"
                onclick="toggleInfoEdit()">
          <i class="fa-solid fa-pen"></i> Edit
        </button>
      </div>
      <div class="card-body">

        <!-- Loading state -->
        <div id="info-loading" style="text-align:center; color:var(--grey-400);">
          <span class="spinner"></span>
        </div>

        <!-- Read-only display -->
        <div id="info-display" style="display:none;">
          <div style="display:grid; gap:14px;">
            <div>
              <div class="text-muted text-sm">Full Name</div>
              <div style="font-weight:600;" id="disp-name"></div>
            </div>
            <div>
              <div class="text-muted text-sm">Email Address</div>
              <div id="disp-email"></div>
            </div>
            <div>
              <div class="text-muted text-sm">Phone Number</div>
              <div id="disp-phone"></div>
            </div>
            <div>
              <div class="text-muted text-sm">Account Role</div>
              <div id="disp-role"></div>
            </div>
          </div>
        </div>

        <!-- Editable form (hidden by default) -->
        <div id="info-form" style="display:none;">
          <div class="form-group">
            <label for="f-name">Full Name</label>
            <input type="text" id="f-name" class="form-control">
          </div>
          <div class="form-group">
            <label for="f-email">Email Address</label>
            <input type="email" id="f-email" class="form-control">
          </div>
          <div class="form-group">
            <label for="f-phone">Phone Number</label>
            <input type="tel" id="f-phone" class="form-control">
          </div>
          <div style="display:flex; gap:10px; margin-top:4px;">
            <button class="btn btn-primary" id="save-info-btn"
                    onclick="saveInfo()">
              <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
            <button class="btn btn-ghost" onclick="toggleInfoEdit()">
              Cancel
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- =====================================================
         SECTION 2: Change Password
         ===================================================== -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fa-solid fa-lock"></i> Change Password</h3>
      </div>
      <div class="card-body">

        <div class="form-group">
          <label for="pw-current">Current Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="pw-current" class="form-control"
                   placeholder="Enter your current password">
            <button type="button" class="toggle-pw"
                    onclick="toggleVis('pw-current', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="pw-new">New Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="pw-new" class="form-control"
                   placeholder="Minimum 8 characters">
            <button type="button" class="toggle-pw"
                    onclick="toggleVis('pw-new', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <!-- Password strength bar -->
          <div class="strength-bar">
            <div class="strength-bar-fill" id="strength-fill"></div>
          </div>
          <p class="form-hint" id="strength-label"></p>
        </div>

        <div class="form-group">
          <label for="pw-confirm">Confirm New Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="pw-confirm" class="form-control"
                   placeholder="Re-enter new password">
            <button type="button" class="toggle-pw"
                    onclick="toggleVis('pw-confirm', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <p class="form-hint text-danger" id="pw-match-msg"
             style="display:none;">Passwords do not match.</p>
        </div>

        <button class="btn btn-primary" id="save-pw-btn"
                onclick="savePassword()">
          <i class="fa-solid fa-floppy-disk"></i> Update Password
        </button>

      </div>
    </div>

  </div>

  <script src="../js/main.js"></script>
  <script>
    // ==========================================================
    // PROFILE PAGE JAVASCRIPT
    // ==========================================================

    let userData = {}; // Store loaded user data for edit form

    // Session check — any logged in role can access profile
    async function loadProfile() {
      try {
        const res  = await fetch('../php/session_check.php');
        const data = await res.json();

        if (!data.logged_in) {
          window.location.href = '../index.html?msg=login_required';
          return;
        }

        // Load full profile from a dedicated endpoint
        const res2   = await fetch('../php/get_profile.php');
        userData     = await res2.json();

        document.getElementById('info-loading').style.display = 'none';
        document.getElementById('info-display').style.display = 'block';

        // Populate read-only display
        document.getElementById('disp-name').textContent  = userData.full_name;
        document.getElementById('disp-email').textContent = userData.email;
        document.getElementById('disp-phone').textContent = userData.phone;
        document.getElementById('disp-role').innerHTML    =
          `<span class="badge badge-confirmed">${userData.role}</span>`;

        // Pre-fill the edit form inputs
        document.getElementById('f-name').value  = userData.full_name;
        document.getElementById('f-email').value = userData.email;
        document.getElementById('f-phone').value = userData.phone;

      } catch (err) {
        document.getElementById('info-loading').style.display = 'none';
        showAlert('Could not load profile.', 'error');
      }
    }

    // --- Toggle between read view and edit form ---
    function toggleInfoEdit() {
      const display = document.getElementById('info-display');
      const form    = document.getElementById('info-form');
      const btn     = document.getElementById('edit-info-btn');

      if (form.style.display === 'none') {
        display.style.display = 'none';
        form.style.display    = 'block';
        btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Cancel';
      } else {
        display.style.display = 'block';
        form.style.display    = 'none';
        btn.innerHTML = '<i class="fa-solid fa-pen"></i> Edit';
      }
    }

    // --- Save updated personal info ---
    async function saveInfo() {
      const name  = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const phone = document.getElementById('f-phone').value.trim();

      if (!name || !email || !phone) {
        showAlert('All fields are required.', 'error');
        return;
      }

      setLoading('save-info-btn', true);

      try {
        const res  = await fetch('../php/save_profile.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone }),
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Profile updated successfully.', 'success');
          // Update the display view with new values
          document.getElementById('disp-name').textContent  = name;
          document.getElementById('disp-email').textContent = email;
          document.getElementById('disp-phone').textContent = phone;
          toggleInfoEdit(); // Switch back to read view
        } else {
          showAlert(data.error || 'Update failed.', 'error');
        }
      } catch (err) {
        showAlert('Network error. Try again.', 'error');
      }

      setLoading('save-info-btn', false);
    }

    // --- Password visibility toggle ---
    function toggleVis(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type     = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type     = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    // --- Password strength indicator ---
    document.getElementById('pw-new').addEventListener('input', function () {
      const val   = this.value;
      const fill  = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (val.length >= 8)           score++;
      if (/[A-Z]/.test(val))         score++;
      if (/[0-9]/.test(val))         score++;
      if (/[^A-Za-z0-9]/.test(val))  score++;
      const levels = [
        { w:'10%', c:'#ef4444', t:'' },
        { w:'25%', c:'#ef4444', t:'Weak' },
        { w:'50%', c:'#f59e0b', t:'Fair' },
        { w:'75%', c:'#3b82f6', t:'Good' },
        { w:'100%',c:'#10b981', t:'Strong' },
      ];
      const lvl          = levels[score];
      fill.style.width   = lvl.w;
      fill.style.background = lvl.c;
      label.textContent  = lvl.t;
    });

    // --- Confirm password match check ---
    document.getElementById('pw-confirm').addEventListener('input', function () {
      const match = this.value === document.getElementById('pw-new').value;
      document.getElementById('pw-match-msg').style.display =
        match ? 'none' : 'block';
    });

    // --- Save new password ---
    async function savePassword() {
      const current = document.getElementById('pw-current').value;
      const newPw   = document.getElementById('pw-new').value;
      const confirm = document.getElementById('pw-confirm').value;

      if (!current || !newPw || !confirm) {
        showAlert('All password fields are required.', 'error');
        return;
      }
      if (newPw.length < 8) {
        showAlert('New password must be at least 8 characters.', 'error');
        return;
      }
      if (newPw !== confirm) {
        showAlert('New passwords do not match.', 'error');
        return;
      }

      setLoading('save-pw-btn', true);

      try {
        const res  = await fetch('../php/save_profile.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            change_password: true,
            current_password: current,
            new_password: newPw,
          }),
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Password changed successfully.', 'success');
          // Clear all password fields
          document.getElementById('pw-current').value = '';
          document.getElementById('pw-new').value     = '';
          document.getElementById('pw-confirm').value = '';
          document.getElementById('strength-fill').style.width = '0';
          document.getElementById('strength-label').textContent = '';
        } else {
          showAlert(data.error || 'Password change failed.', 'error');
        }
      } catch (err) {
        showAlert('Network error. Try again.', 'error');
      }

      setLoading('save-pw-btn', false);
    }

    loadProfile();
  </script>

</body>
</html>
